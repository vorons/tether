name: build

# Linux binary on every push to main, packed as tar.gz.
# Versioning: short commit hash in the release tag (no manual tags needed).
# Releases (not just artifacts) because artifact-blob downloads periodically
# fail with Azure SAS errors outside our control.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua (only non-default build tool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - name: Build
        run: make tether
      - name: Pack
        run: |
          short="${GITHUB_SHA::7}"
          tar czf "tether-${short}-linux-x86_64.tar.gz" tether
          echo "SHORT=${short}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: tether-linux
          path: "*.tar.gz"
          retention-days: 30
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tether-${{ env.SHORT }}
          name: tether-${{ env.SHORT }}
          files: "*.tar.gz"
